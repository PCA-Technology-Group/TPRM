<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netrio TPRM Platform — Prototype</title>
<style>
:root{
  --navy:#0f2a43; --navy2:#16385a; --teal:#0ea5a6; --teal-d:#0b8788;
  --bg:#f4f6f9; --card:#ffffff; --line:#e3e8ef; --txt:#1c2733; --mut:#64748b;
  --crit:#c0392b; --high:#e67e22; --med:#f1c40f; --low:#27ae60; --info:#2f80ed;
  --brand:var(--teal);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
#app{display:flex;min-height:100vh}
/* sidebar */
#side{width:225px;background:var(--navy);color:#cfd9e4;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#logo{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
#logo .nm{font-size:17px;font-weight:700;color:#fff;letter-spacing:.3px}
#logo .sub{font-size:10.5px;color:#7f96ab;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
#nav{flex:1;padding:10px 8px;overflow-y:auto}
.navi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:13.5px;color:#b9c7d4}
.navi:hover{background:rgba(255,255,255,.07);color:#fff}
.navi.on{background:var(--brand);color:#fff;font-weight:600}
.navi .ic{width:18px;text-align:center;font-size:15px}
.navsec{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#5f7893;padding:14px 12px 5px}
#sidefoot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7f96ab}
/* topbar */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
#top h1{font-size:16px;font-weight:650}
#top .sp{flex:1}
select,input,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--txt)}
select:focus,input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.rolebox{display:flex;align-items:center;gap:8px;background:#eef2f7;border-radius:8px;padding:5px 10px;font-size:12.5px}
.rolebox label{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
#view{padding:22px;max-width:1280px;width:100%;margin:0 auto}
/* cards & layout */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-size:13px;font-weight:650;margin-bottom:10px;color:var(--txt)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1}
.kpi .l{font-size:12px;color:var(--mut);margin-top:3px}
.kpi .d{font-size:11px;margin-top:6px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer} tbody tr:hover{background:#f8fafc}
tbody tr.nolink{cursor:default} tbody tr.nolink:hover{background:none}
/* badges */
.b{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:11px;font-weight:650;white-space:nowrap}
.b.crit{background:#fdecea;color:var(--crit)} .b.high{background:#fdf0e3;color:#c56a10}
.b.med{background:#fcf6da;color:#9a7d00} .b.low{background:#e8f7ee;color:#1e8449}
.b.info{background:#e8f0fd;color:var(--info)} .b.gray{background:#eef1f5;color:var(--mut)}
.b.teal{background:#e0f4f4;color:var(--teal-d)} .b.navy{background:#e6ebf2;color:var(--navy)}
.tier{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-weight:700;font-size:12px;color:#fff}
.t1{background:var(--crit)} .t2{background:var(--high)} .t3{background:#b7950b} .t4{background:var(--low)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--txt);font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{background:#f4f6f9}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(.94)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.ok{background:#e8f7ee;border-color:#bfe6cd;color:#1e8449}
.btn.no{background:#fdecea;border-color:#f2c4bd;color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* misc */
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut)} .sm{font-size:12px} .xs{font-size:11px}
.mb{margin-bottom:14px} .mt{margin-top:14px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.hd h2{font-size:18px;font-weight:700}
.hd .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.bar{height:8px;background:#edf1f5;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill-tabs .pt{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--mut)}
.pill-tabs .pt.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* modal & drawer */
#ovl{position:fixed;inset:0;background:rgba(15,42,67,.45);display:none;z-index:100}
#ovl.show{display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;max-width:660px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:16px;margin-bottom:4px}
.modal .msub{font-size:12.5px;color:var(--mut);margin-bottom:16px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;font-weight:650;margin-bottom:4px}
.fg label .req{color:var(--crit)}
.fg input,.fg select,.fg textarea{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chks{display:flex;flex-wrap:wrap;gap:8px}
.chks label{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;background:#f4f6f9;padding:5px 10px;border-radius:7px;cursor:pointer;margin:0}
#drawer{position:fixed;top:0;right:-580px;width:560px;max-width:95vw;height:100vh;background:#fff;box-shadow:-12px 0 40px rgba(0,0,0,.15);z-index:90;transition:right .25s;overflow-y:auto}
#drawer.show{right:0}
#drawer .dh{position:sticky;top:0;background:#fff;padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:5}
#drawer .db{padding:18px 20px}
/* stepper */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;position:relative;padding-bottom:16px}
.step .dot{width:22px;height:22px;border-radius:50%;background:#e3e8ef;color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;z-index:2}
.step.done .dot{background:var(--low);color:#fff}
.step.cur .dot{background:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(14,165,166,.18)}
.step:not(:last-child):before{content:"";position:absolute;left:10.5px;top:22px;bottom:0;width:1.5px;background:var(--line)}
.step .st{font-weight:650;font-size:13px}
.step .sd{font-size:12px;color:var(--mut)}
/* heatmap */
.hm{display:grid;grid-template-columns:70px repeat(4,1fr);gap:5px;font-size:12px}
.hm .hc{border-radius:8px;padding:12px 6px;text-align:center;font-weight:700;font-size:16px}
.hm .hl{display:flex;align-items:center;font-weight:650;color:var(--mut);font-size:11px}
.hm .hh{text-align:center;font-size:11px;color:var(--mut);font-weight:650;padding-bottom:2px}
/* trend chart */
.trend{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.trend .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.trend .tbar{width:70%;max-width:38px;border-radius:5px 5px 0 0;background:var(--brand);opacity:.85}
.trend .tl{font-size:10px;color:var(--mut)}
/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:200;transition:transform .25s;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
/* questionnaire */
.q{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
.q .qd{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--brand);font-weight:700}
.q .qt{font-weight:600;margin:5px 0 9px;font-size:13.5px}
.q .opts{display:flex;gap:8px;flex-wrap:wrap}
.q .opts label{display:flex;gap:5px;align-items:center;background:#f4f6f9;padding:6px 11px;border-radius:7px;cursor:pointer;font-size:12.5px}
.ev{margin-top:9px;padding:8px 10px;background:#f8fafc;border:1px dashed #c9d4e0;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fw{color:#fff}
.msg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.msg .mh{font-size:11px;color:var(--mut);margin-bottom:3px}
.msg.mine{background:#e0f4f4;border-color:#bfe4e4}
.brandbar{border-radius:12px;padding:16px 20px;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.wl-logo{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.notice{background:#fdf6e3;border:1px solid #f0e0b0;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#7d6608;margin-bottom:14px}
.notice.red{background:#fdecea;border-color:#f2c4bd;color:var(--crit)}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="logo"><div class="nm" id="logoName">NETRIO</div><div class="sub" id="logoSub">TPRM Platform</div></div>
    <nav id="nav"></nav>
    <div id="sidefoot">Prototype v1.0 · Internal build<br>Cyber Governance Team</div>
  </aside>
  <div id="main">
    <div id="top">
      <h1 id="pgTitle">Dashboard</h1>
      <div class="sp"></div>
      <div class="rolebox" id="presentPick" style="display:none"><label>Present to</label><select id="presentSel" onchange="presentClient(this.value); this.value=''"><option value="">Choose client…</option><option value="c1">Lone Star Health Partners</option><option value="c2">Crestline Financial Group</option><option value="c3">BlueSky Logistics</option></select></div>
      <div class="rolebox" id="clientPick" style="display:none"><label>Client</label><select id="clientSel" onchange="setClient(this.value)"></select></div>
      <div class="rolebox"><label>Role</label>
        <select id="roleSel" onchange="setRole(this.value)">
          <option value="nadmin">Netrio Admin</option>
          <option value="nanalyst">Netrio Analyst</option>
          <option value="cadmin">Client Admin</option>
          <option value="cviewer">Client Viewer</option>
          <option value="vendor">Vendor Contact</option>
        </select>
      </div>
    </div>
    <div id="view"></div>
  </div>
</div>
<div id="ovl" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBox"></div></div>
<div id="drawer"></div>
<div id="toast"></div>

<script>
/* ============================================================

   ============================================================ */

const SIG_DOMAINS = ["Access Control","Application Management","Artificial Intelligence (AI)","Asset and Information Management","Cloud Services","Compliance Management","Cybersecurity Incident Management","Endpoint Security","Enterprise Risk Management","Environmental, Social, Governance (ESG)","Human Resources Security","Information Assurance","IT Operations Management","Network Security","Nth Party Management","Operational Resilience","Physical and Environmental Security","Privacy Management","Server Security","Supply Chain Risk Management (SCRM)","Threat Management"];

const FRAMEWORKS = ["ISO 27001:2022","NIST CSF 2.0","NIST SP 800-53r5","NIST SP 800-171r3","ISO/IEC 42001:2023","CIS Controls v8","CMMC 2.0","HIPAA","EU GDPR","EU NIS 2","DORA","NYDFS 500","FedRAMP","FFIEC","CSA CCM v4","PCI DSS 4.0","NERC"];

let TIER_SCOPE = {1:[...Array(21).keys()], 2:[0,1,3,4,5,6,7,8,11,12,13,15,16,17,18,20], 3:[0,4,5,6,7,13,17,20], 4:[0,6,17]};

// weighted scoring model (configurable)
let SCORING = {
  categories:[
    {id:"ds", name:"Data Security", weight:30},
    {id:"bc", name:"Business Continuity", weight:20},
    {id:"cm", name:"Compliance", weight:25},
    {id:"fs", name:"Financial Stability", weight:10},

  ],

const SERVICE_CATS = ["Cloud / SaaS","Data Center & Hosting","Software Development","Payroll / HR","Financial Services","Facilities","Logistics","Marketing","Legal","Managed Security","Telecom","Hardware Supplier"];

const ANALYSTS = ["J. Alvarez","P. Whitfield","S. Nakamura"];

const CLIENTS = [
  {id:"c1", name:"Lone Star Health Partners", short:"LSH", industry:"Healthcare", entTotal:40, entUsed:31, entPeriod:"Contract year (resets Mar 1)", whiteLabel:true, wlColor:"#7d3c98", notif:"hybrid", frameworks:["HIPAA","NIST CSF 2.0","ISO 27001:2022"], ccClientOnVendorEmails:true, ccAnalystOnClientEmails:true},
  {id:"c2", name:"Crestline Financial Group", short:"CFG", industry:"Financial Services", entTotal:60, entUsed:22, entPeriod:"Calendar year", whiteLabel:false, wlColor:"#0ea5a6", notif:"client-direct", frameworks:["NYDFS 500","FFIEC","PCI DSS 4.0","NIST CSF 2.0"], ccClientOnVendorEmails:true, ccAnalystOnClientEmails:false},

// assessment types & whether each consumes a client's contracted entitlement (configurable — Platform Config > Assessment Types)
let ASSESS_TYPES = [

function assessTypeName(id){ return (ASSESS_TYPES.find(t=>t.id===id)||ASSESS_TYPES[0]).name; }
function typeBadge(id){ const m={full_sig:"navy",doc_review:"info",pulse:"teal",client_custom:"gray"}; return `<span class="b ${m[id]||"gray"}">${assessTypeName(id||"full_sig")}</span>`; }

const STATUSES = ["Pending Onboarding","Active","Under Assessment","Assessment Complete","Inactive / Offboarded"];

let VENDORS = [
  {id:"v1", clientId:"c1", name:"MedCloud Systems", contact:"Rita Okafor", email:"rokafor@medcloud.io", cat:"Cloud / SaaS", dataTypes:["PHI","PII"], tier:1, status:"Under Assessment", contractEnd:"2026-09-30", score:62, rating:"High", lastAssess:"2025-07-10", website:"medcloud.io", desc:"EHR hosting and clinical data platform"},

  {id:"v3", clientId:"c1", name:"Sterile Supply Co", contact:"Meg Liu", email:"mliu@sterilesupply.com", cat:"Hardware Supplier", dataTypes:["Confidential"], tier:3, status:"Active", contractEnd:"2026-08-12", score:74, rating:"Medium", lastAssess:"2025-11-20", website:"sterilesupply.com", desc:"Medical supply logistics"},
  {id:"v4", clientId:"c1", name:"Archview Legal", contact:"T. Broussard", email:"tb@archviewlegal.com", cat:"Legal", dataTypes:["PHI","Confidential"], tier:2, status:"Under Assessment", contractEnd:"2026-12-01", score:null, rating:null, lastAssess:null, website:"archviewlegal.com", desc:"Outside counsel — malpractice"},

  {id:"v6", clientId:"c2", name:"LedgerLink Core", contact:"A. Osei", email:"aosei@ledgerlink.com", cat:"Financial Services", dataTypes:["Financial","PII"], tier:1, status:"Under Assessment", contractEnd:"2026-07-28", score:44, rating:"Critical", lastAssess:"2025-06-30", website:"ledgerlink.com", desc:"Core banking ledger platform"},

// assessment stages per PRD 3.5
const STAGES = ["Initiation","Questionnaire Assignment","Distribution","Vendor Response","Netrio Review","Scoring","Findings & Recommendations","Client Review","Closure"];

let ASSESSMENTS = [
  {id:"a1", vendorId:"v1", clientId:"c1", trigger:"Automatic — Tier-Based", cycle:"Periodic Reassessment", stage:4, questionnaire:"Netrio SIG 2026", sigVersion:"2026.1", analyst:"J. Alvarez", initiated:"2026-06-01", due:"2026-07-01", overdue:true, score:null, respMethod:"Portal Login", type:"full_sig"},
  {id:"a2", vendorId:"v4", clientId:"c1", trigger:"Manual — Client", cycle:"Initial Onboarding Assessment", stage:3, questionnaire:"Netrio SIG 2026 (Tier 2 scope)", sigVersion:"2026.1", analyst:"P. Whitfield", initiated:"2026-06-20", due:"2026-07-20", overdue:false, score:null, respMethod:"Email Link (No Login)", type:"full_sig"},
  {id:"a3", vendorId:"v6", clientId:"c2", trigger:"Event-Driven", cycle:"Event-Driven Reassessment", stage:6, questionnaire:"Netrio SIG 2026", sigVersion:"2026.1", analyst:"J. Alvarez", initiated:"2026-05-15", due:"2026-06-15", overdue:true, score:44, event:"Vendor disclosed security incident (May 2026)", respMethod:"Portal Login", type:"full_sig"},
  {id:"a4", vendorId:"v10", clientId:"c3", trigger:"Automatic — Contract Date", cycle:"Periodic Reassessment", stage:2, questionnaire:"Client questionnaire: BSL-VendorSec-v3.xlsx", sigVersion:"—", analyst:"S. Nakamura", initiated:"2026-07-01", due:"2026-08-01", overdue:false, score:null, respMethod:"Email Link (No Login)", type:"client_custom"},

/* ---------- shared components ---------- */
function heatmap(vendors){
  const ratings=["Critical","High","Medium","Low"];
  const colors={Critical:"#fdecea",High:"#fdf0e3",Medium:"#fcf6da",Low:"#e8f7ee"};
  const tcolors={Critical:"var(--crit)",High:"#c56a10",Medium:"#9a7d00",Low:"#1e8449"};
  let html='<div class="hm"><div></div>'+ratings.map(r=>`<div class="hh">${r}</div>`).join("");
  for(let t=1;t<=4;t++){
    html+=`<div class="hl">Tier ${t}</div>`;
    ratings.forEach(r=>{
      const n=vendors.filter(v=>v.tier===t&&v.rating===r).length;
      html+=`<div class="hc" style="background:${n?colors[r]:"#f6f8fa"};color:${n?tcolors[r]:"#c3ccd6"}">${n||"·"}</div>`;
    });
  }
  return html+"</div>";
}

function trendChart(points, max=100){
  return `<div class="trend">${points.map(p=>`<div class="tb"><div class="tbar" style="height:${p.v/max*100}%;background:${scoreColor(p.v)}"></div><div class="tl">${p.l}</div></div>`).join("")}</div><div class="xs mut mt" style="margin-top:6px">Average vendor risk score (higher = lower risk)</div>`;
}

function entitlementCard(c, compact){
  const pct = Math.round(c.entUsed/c.entTotal*100);
  const col = pct>=100?"var(--crit)":pct>=80?"var(--high)":"var(--brand)";
  return `<div class="card">
    <h3>Assessment Entitlement ${compact?`— ${c.short}`:""}</h3>
    <div class="row" style="justify-content:space-between"><div><span style="font-size:22px;font-weight:700">${c.entUsed}</span> <span class="mut">of ${c.entTotal} used</span></div><span class="b ${pct>=100?"crit":pct>=80?"high":"teal"}">${pct}%</span></div>
    <div class="bar mt" style="margin-top:10px"><i style="width:${Math.min(pct,100)}%;background:${col}"></i></div>
    <div class="xs mut" style="margin-top:8px">${c.entPeriod} · ${pct>=100?"Limit reached — contact Netrio to expand your contract":pct>=80?"Approaching limit — alerts sent at 80%":"Within entitlement"}</div>
  </div>`;
}

      </div>
      ${canWork&&a.stage<9&&!a.cancelled?`<div class="row" style="margin-top:6px">${a.stage===4?`<button class="btn sm pri" onclick="go('review');closeDrawer()">Open Questionnaire Review →</button>`:""}<button class="btn sm ok" onclick="advanceStage('${a.id}')">Advance to: ${STAGES[a.stage]||"Close"}</button><button class="btn sm no" onclick="cancelAndReplace('${a.id}')">Cancel & Replace…</button></div>`:""}

        <tr class="nolink" style="background:#f8fafc"><td><b>Overall (weighted)</b></td><td class="sm">100%</td><td><b style="color:${scoreColor(a.score)};font-size:15px">${a.score}</b></td><td>${rb(ratingOf(a.score))}</td></tr>

      ${a.stage>=7&&a.score!=null&&a.score<70?`<div class="card mb"><h3>Findings & Recommendations</h3>
        <div class="msg"><div class="mh">Finding F-1 · High</div>No validated DR testing in 18 months; RTO/RPO unverified. <b>Recommendation:</b> require DR test report within 60 days; track remediation via ServiceNow task.</div>

function advanceStage(id){
  const a=ASSESSMENTS.find(x=>x.id===id); const v=vendor(a.vendorId);
  a.stage++;
  if(a.stage===6&&a.score==null){ a.score=Math.floor(55+Math.random()*40); }
  if(a.stage>=9){ a.stage=9; a.completed="2026-07-04"; a.overdue=false; v.score=a.score; v.rating=ratingOf(a.score); v.status="Assessment Complete"; v.lastAssess="2026-07-04"; toast("Assessment closed — vendor risk record updated"); }
  else toast("Advanced to stage "+a.stage+": "+STAGES[a.stage-1]);
  log(`Assessment ${id} advanced to stage ${a.stage} (${STAGES[a.stage-1]})`);
  render(); openAssessment(id);
}

function shouldShow(q){ if(!q.showIf) return true; const dep=QUESTIONS.find(x=>x.id===q.showIf.q); return dep && dep.answer===q.showIf.eq; }
VIEWS.review = () => {
  const a=ASSESSMENTS.find(x=>x.id==="a1"); const v=vendor(a.vendorId);
  const visible = QUESTIONS.filter(shouldShow);
  const counts={accepted:0,rejected:0,flagged:0,pending:0}; visible.forEach(q=>counts[q.review]++);
  const byDomain = SIG_DOMAINS.map(d=>({domain:d, qs:visible.filter(q=>q.domain===d)})).filter(g=>g.qs.length);
  return `

  ${byDomain.map(g=>{

function reviewQ(id,st){ const q=QUESTIONS.find(x=>x.id===id); q.review=st; q.note=""; log(`Response ${id} (${q.domain}) accepted — MedCloud Systems`); render(); }

function openClarifyModal(id,st){
  const q=QUESTIONS.find(x=>x.id===id); const a=ASSESSMENTS.find(x=>x.id==="a1"); const c=client(a.clientId);
  const preset = st==="rejected"
    ? `Hi — thanks for your response to "${q.text}" Unfortunately the evidence provided doesn't sufficiently demonstrate this control is in place. Please provide updated documentation or a remediation plan within 5 business days.`
    : `Hi — your response to "${q.text}" has been flagged as insufficient. Could you provide additional clarification or updated evidence to support this response?`;
  openModal(`
    <h3>${st==="rejected"?"Reject Response & Notify Vendor":"Flag Response & Request Clarification"}</h3>
    <div class="msub">${q.domain} · MedCloud Systems — this message is emailed to the vendor contact and logged on the assessment record.</div>
    <div class="fg"><label>Message to vendor (editable)</label><textarea id="clarifyMsg" rows="5">${esc(preset)}</textarea></div>
    <div class="fg"><label>CC on this email</label><div class="chks">
      <label><input type="checkbox" checked disabled> Assigned analyst (${a.analyst})</label>
      <label><input type="checkbox" id="ccClient" ${c.ccClientOnVendorEmails?"checked":""}> Client Admin (${c.name})</label>
    </div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn ${st==="rejected"?"no":""} pri" onclick="submitClarify('${id}','${st}')">Send to Vendor</button></div>`);
}
function submitClarify(id,st){
  const q=QUESTIONS.find(x=>x.id===id); const a=ASSESSMENTS.find(x=>x.id==="a1"); const c=client(a.clientId);
  const msg=$("clarifyMsg").value.trim(); const ccClient=$("ccClient").checked;
  q.review=st; q.note=msg;
  log(`Response ${id} (${q.domain}) ${st} — custom message sent to vendor${ccClient?" (cc: Client Admin, "+a.analyst+")":" (cc: "+a.analyst+")"}`);
  closeModal(); toast(`Email sent to vendor contact · CC: ${a.analyst}${ccClient?", Client Admin":""}`); render();
}
function finishReview(){
  const a=ASSESSMENTS.find(x=>x.id==="a1");
  const vals={Yes:100,Partial:50,No:0,"N/A":100};
  const visible=QUESTIONS.filter(shouldShow);
  const cats=SCORING.categories.map(c=>{const qs=visible.filter(q=>q.cat===c.id);const s=qs.length?Math.round(qs.reduce((t,q)=>t+(vals[q.answer]??100),0)/qs.length):100;return {w:c.weight,s};});
  a.score=Math.round(cats.reduce((t,c)=>t+c.s*c.w,0)/100);
  a.stage=Math.max(a.stage,6);
  const v=vendor(a.vendorId); v.score=a.score; v.rating=ratingOf(a.score);
  log(`Assessment a1 scored: ${a.score}/100 (${v.rating}) via weighted model`);
  toast(`Weighted score calculated: ${a.score}/100 → ${ratingOf(a.score)} risk`);
  openAssessment("a1");
}

  const c=client();
  const banner = state.presenting? `<div class="notice" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span>🖥️ <b>Presentation mode</b> — viewing ${c.name}'s portal exactly as their Client Admin sees it.</span><button class="btn sm pri" onclick="exitPresentation()">Exit to Netrio view</button></div>` : "";
  const brand = c.whiteLabel? `<div class="brandbar" style="background:${c.wlColor}"><div class="wl-logo">${c.short}</div><div><b>${c.name}</b> — Vendor Risk Portal<div class="xs" style="opacity:.8">White-label branding enabled · powered by Netrio</div></div></div>`
  : `<div class="brandbar" style="background:var(--navy)"><div class="wl-logo">N</div><div><b>Netrio Vendor Risk Portal</b> — ${c.name}<div class="xs" style="opacity:.8">Managed by your Netrio Cyber Governance team</div></div></div>`;
  return banner + brand;
}

VIEWS.pdash = () => {
  const c=client(); const vends=VENDORS.filter(v=>v.clientId===c.id);
  const open=ASSESSMENTS.filter(a=>a.clientId===c.id&&a.stage<9);
  const ev=EVIDENCE.filter(e=>e.client===c.id&&e.status!=="Current");
  return `${portalHeader()}
  ${state.role==="cviewer"?'<div class="notice">You are viewing as <b>Client Viewer</b> — read-only. Vendor management, assessment requests and user admin are hidden.</div>':""}
  <div class="grid g4 mb">
    <div class="card kpi"><div class="v">${vends.length}</div><div class="l">Vendors in portfolio</div></div>
    <div class="card kpi"><div class="v" style="color:var(--crit)">${vends.filter(v=>v.rating==="Critical"||v.rating==="High").length}</div><div class="l">Critical / High risk</div></div>
    <div class="card kpi"><div class="v" style="color:${open.some(a=>a.overdue)?"var(--high)":"var(--txt)"}">${open.length}</div><div class="l">Assessments in progress</div><div class="d mut">${open.filter(a=>a.overdue).length} overdue</div></div>
    <div class="card kpi"><div class="v" style="color:var(--high)">${ev.length}</div><div class="l">Evidence alerts</div></div>
  </div>
  <div class="grid g2 mb">
    ${entitlementCard(c)}
    <div class="card"><h3>Risk Trend — Your Portfolio</h3>${trendChart([{l:"Feb",v:68},{l:"Mar",v:70},{l:"Apr",v:74},{l:"May",v:72},{l:"Jun",v:70},{l:"Jul",v:73}])}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Vendor Risk Heatmap</h3>${heatmap(vends)}</div>
    <div class="card"><h3>Needs Your Attention</h3>
      ${open.map(a=>{const v=vendor(a.vendorId);return `<div class="msg"><div class="row" style="justify-content:space-between"><b>${v.name}</b>${stageBadge(a)}</div><div class="xs mut" style="margin-top:3px">${a.cycle} · due ${a.due}</div></div>`;}).join("")||'<div class="mut sm">Nothing outstanding.</div>'}
      ${ev.map(e=>`<div class="msg"><div class="row" style="justify-content:space-between"><b>${e.vendor}</b><span class="b ${e.status==="Expired"?"crit":"high"}">${e.status}</span></div><div class="xs mut" style="margin-top:3px">📄 ${e.doc} · expires ${e.expires}</div></div>`).join("")}
    </div>
  </div>`;
};

VIEWS.pvendors = () => {
  const c=client(); const vends=VENDORS.filter(v=>v.clientId===c.id);
  return `${portalHeader()}
  <div class="hd"><div><h2>My Vendors</h2><div class="sub">${vends.length} vendors · data isolated to ${c.name} only</div></div>
  ${state.role==="cadmin"?`<div class="row"><button class="btn" onclick="newAssessmentModal()">Request Assessment</button><button class="btn pri" onclick="addVendorModal('${c.id}')">+ Add Vendor</button></div>`:""}</div>
  <div class="card">${vendorTable(vends,false)}</div>`;
};

VIEWS.passess = () => {
  const c=client(); const list=ASSESSMENTS.filter(a=>a.clientId===c.id);
  return `${portalHeader()}
  <div class="hd"><div><h2>Assessments</h2><div class="sub">In-progress and completed assessments for your vendors</div></div>
  ${state.role==="cadmin"?`<button class="btn pri" onclick="newAssessmentModal()">Request New Assessment</button>`:""}</div>
  <div class="card"><table><thead><tr><th>Vendor</th><th>Type</th><th>Cycle</th><th>Questionnaire</th><th>Status</th><th>Due / Completed</th><th>Result</th></tr></thead><tbody>
  ${list.map(a=>{const v=vendor(a.vendorId);return `<tr onclick="openAssessment('${a.id}')"><td><b>${v.name}</b></td><td>${typeBadge(a.type)}</td><td class="sm">${a.cycle}</td><td class="sm">${a.questionnaire}</td><td>${stageBadge(a)}</td><td class="sm">${a.completed||a.due}</td><td>${a.score!=null?`<b style="color:${scoreColor(a.score)}">${a.score}</b> ${rb(ratingOf(a.score))}`:"—"}</td></tr>`;}).join("")}
  </tbody></table></div>`;
};

VIEWS.preports = () => `${portalHeader()}<div class="hd"><div><h2>Reports</h2><div class="sub">Download in any format, or schedule automated delivery to your stakeholders</div></div></div>${reportsBody(client())}`;

VIEWS.pmsg = () => `${portalHeader()}
  <div class="hd"><div><h2>Messages</h2><div class="sub">In-platform communication with your Netrio Cyber Governance team</div></div></div>
  <div class="card" style="max-width:720px">
    ${MESSAGES.map(m=>`<div class="msg ${m.mine?"mine":""}"><div class="mh">${m.from} · ${m.ts}</div>${esc(m.text)}</div>`).join("")}
    <div class="row mt"><input id="msgIn" placeholder="Write a message to your Netrio team…" style="flex:1"><button class="btn pri" onclick="sendMsg()">Send</button></div>
  </div>`;
function sendMsg(){ const t=$("msgIn").value.trim(); if(!t) return; MESSAGES.push({from:roleName()+" ("+client().short+")", mine:state.role==="cadmin"||state.role==="cviewer", ts:"Jul 4", text:t}); log("Portal message sent to Netrio team"); render(); toast("Message sent — your Netrio analyst is notified"); }

VIEWS.psettings = () => {
  const c=client();
  return `${portalHeader()}
  <div class="hd"><div><h2>Settings & Users</h2><div class="sub">Client Admin — manage your organization's portal users and preferences</div></div></div>
  <div class="grid g2 mb">
    <div class="card"><h3>Portal Users (your organization only)</h3><table><thead><tr><th>User</th><th>Role</th><th>MFA</th><th></th></tr></thead><tbody>
      ${[["cadmin@"+c.short.toLowerCase()+".com","Client Admin"],["j.rivera@"+c.short.toLowerCase()+".com","Client Viewer"],["m.osei@"+c.short.toLowerCase()+".com","Client Viewer"]].map(u=>`<tr class="nolink"><td class="sm">${u[0]}</td><td><span class="b ${u[1]==="Client Admin"?"teal":"gray"}">${u[1]}</span></td><td><span class="b low">On</span></td><td><button class="btn sm" onclick="toast('User management (mock)')">Edit</button></td></tr>`).join("")}
      </tbody></table>
      <button class="btn sm mt" style="margin-top:10px" onclick="toast('Invite sent (mock) — Azure AD SSO or email/password fallback')">+ Invite user</button></div>
    <div class="card"><h3>Upload Your Own Questionnaire</h3>
      <div class="sm mut mb">Prefer your own questionnaire over the Netrio SIG? Upload Excel, PDF, or form-based questionnaires for use in assessments (PRD §4.2).</div>
      <div class="ev" style="padding:22px;justify-content:center;cursor:pointer" onclick="uploadQ()">⬆ Click to upload questionnaire (xlsx, pdf, docx)</div>
      <div class="mt" style="margin-top:12px"><b class="sm">Uploaded:</b><div class="msg" style="margin-top:6px"><div class="row" style="justify-content:space-between">📄 ${c.id==="c3"?"BSL-VendorSec-v3.xlsx":"(none yet)"}${c.id==="c3"?'<span class="b teal">In use — RouteWise TMS assessment</span>':""}</div></div></div>
      <div class="xs mut mt">Native Netrio SIG questions support conditional branching — a follow-up question can appear only when a prior answer meets a condition (see the Supply Chain Risk Management domain in a live SIG assessment for an example). For client-uploaded Excel/PDF questionnaires, only question text and structure are used — Excel-native conditional formatting (cell colors, data validation rules) is cosmetic and is not interpreted by the platform. Mapping uploaded questions into structured, branching logic is an open item for technical design.</div></div>
  </div>
  <div class="card"><h3>Notification Preferences</h3>
    <div class="sm mut mb">Current mode: <span class="b teal">${ {"netrio-managed":"Netrio-managed — your analyst handles all communication","client-direct":"Client-direct — you receive automated notifications","hybrid":"Hybrid — both you and Netrio receive notifications"}[c.notif] }</span></div>
    <div class="xs mut">Contact your Netrio admin to change the notification model, or adjust per-event settings above in a full build.</div></div>`;
};
function uploadQ(){ toast("Questionnaire uploaded (mock) — parsing approach is PRD Open Item #2"); log("Client uploaded custom questionnaire via portal"); }

/* ============================================================
   VENDOR CONTACT VIEWS
   ============================================================ */
VIEWS.vq = () => {
  const visible=QUESTIONS.filter(shouldShow);
  const answered=visible.filter(q=>q.answer).length;
  return `
  <div class="brandbar" style="background:var(--navy)"><div class="wl-logo">N</div><div><b>Netrio Secure Questionnaire</b> — MedCloud Systems<div class="xs" style="opacity:.8">On behalf of Lone Star Health Partners · SIG 2026.1 · secure link expires in 6 days</div></div></div>
  <div class="notice">You only see the questionnaire assigned to you. No visibility into other vendors, assessments, or client data (PRD §7.3). Progress saves automatically. Some questions only appear based on how you answer an earlier question — try changing the Supply Chain Risk Management answer below.</div>
  <div class="card mb"><div class="row" style="justify-content:space-between"><b>Progress: ${answered} of ${visible.length} applicable questions answered</b><span class="b ${answered===visible.length?"low":"info"}">${Math.round(answered/visible.length*100)}%</span></div>
  <div class="bar mt" style="margin-top:8px"><i style="width:${answered/visible.length*100}%;background:var(--brand)"></i></div></div>
  ${visible.map((q,i)=>`
  <div class="q">
    <div class="qd">${q.showIf?"Follow-up question · ":`Question ${i+1} · `}${q.domain}</div>
    <div class="qt">${q.text}</div>
    <div class="opts">${["Yes","Partial","No","N/A"].map(o=>`<label><input type="radio" name="vq_${q.id}" ${q.answer===o?"checked":""} onchange="setAnswer('${q.id}','${o}')">${o}</label>`).join("")}</div>
    ${q.review==="rejected"||q.review==="flagged"?`<div class="xs" style="margin-top:8px;color:var(--crit)"><b>Netrio reviewer requested clarification:</b> ${esc(q.note)}</div>`:""}
    <div class="ev">${q.evidence?`📎 ${q.evidence.name} <span class="xs mut">· uploaded, expires ${q.evidence.expires}</span> <button class="btn sm" onclick="toast('Replaced (mock)')">Replace</button>`:`<button class="btn sm" onclick="attachEvidence('${q.id}')">⬆ Attach supporting evidence</button> <span class="xs mut">Documents, screenshots, or files per question</span>`}</div>
  </div>`).join("")}
  <div class="card"><div class="row" style="justify-content:space-between"><div class="sm mut">Submitting notifies the assigned Netrio analyst and your client contact.</div><button class="btn pri" onclick="toast('Questionnaire submitted — Netrio review begins (stage 5)');log('MedCloud Systems submitted questionnaire responses')">Submit Questionnaire</button></div></div>`;
};
function setAnswer(id,val){ const q=QUESTIONS.find(x=>x.id===id); q.answer=val; q.review="pending"; render(); }
function attachEvidence(id){ const q=QUESTIONS.find(x=>x.id===id); q.evidence={name:"evidence_upload.pdf",expires:"2027-07-04"}; render(); toast("Evidence attached to this question"); }

VIEWS.vev = () => `
  <div class="brandbar" style="background:var(--navy)"><div class="wl-logo">N</div><div><b>My Evidence Library</b> — MedCloud Systems<div class="xs" style="opacity:.8">Accepted evidence is stored on your record and may be referenced in future assessments</div></div></div>
  <div class="card"><table><thead><tr><th>Document</th><th>Linked question</th><th>Expires</th><th>Status</th></tr></thead><tbody>
  ${QUESTIONS.filter(shouldShow).filter(q=>q.evidence).map(q=>`<tr class="nolink"><td class="sm">📄 ${q.evidence.name}</td><td class="sm mut">${q.domain}</td><td class="sm">${q.evidence.expires}</td>
    <td><span class="b ${q.evidence.expires<"2026-07-04"?"crit":q.evidence.expires<"2026-08-04"?"high":"low"}">${q.evidence.expires<"2026-07-04"?"Expired — replace required":q.evidence.expires<"2026-08-04"?"Expiring soon":"Current"}</span></td></tr>`).join("")}
  </tbody></table>
  <div class="xs mut mt">You'll receive automated reminders when evidence approaches expiration.</div></div>`;

/* ---------- init ---------- */
setRole("nadmin");
</script>
